<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer's Policy Summary</title>
<meta name="theme-color" content="#1f4e8c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Policy Summary">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="xlsx.full.min.js"></script>
<script>window.XLSX||document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"><\/script>')</script>
<style>
:root{
  --bg:#f4f6fa; --card:#fff; --ink:#1b2333; --muted:#677189; --line:#e3e7ef;
  --brand:#1f4e8c; --brand2:#2f6fbf; --soft:#eaf1fb;
  --good:#1e8e5a; --goodbg:#e3f5ec; --partial:#c98a0b; --partialbg:#fdf3dc;
  --gap:#c8372d; --gapbg:#fbe5e3; --na:#9aa3b5; --nabg:#eef0f4;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 20px;background:var(--brand);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;margin-right:auto;cursor:pointer}
.brand small{display:block;font-weight:400;font-size:11.5px;opacity:.8}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 13px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--brand2)}
.btn.primary{background:var(--brand2);border-color:var(--brand2);color:#fff}
.btn.primary:hover{background:var(--brand)}
.topbar .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#fff}
.topbar .btn:hover{background:rgba(255,255,255,.22)}
.topbar .btn.primary{background:#fff;color:var(--brand);border-color:#fff}
main{max-width:1280px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.card h2{margin:0 0 12px;font-size:15px}
.card h2 .sub{font-weight:400;color:var(--muted);font-size:12.5px;margin-left:6px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1.4fr 1fr}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .v{font-size:24px;font-weight:700;margin-top:2px}
.kpi .l{color:var(--muted);font-size:12.5px}
.kpi.warn .v{color:var(--gap)}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;background:#fafbfd;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--soft)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:3px;vertical-align:middle}
.s-good{background:var(--good)} .s-partial{background:var(--partial)} .s-gap{background:var(--gap)} .s-na{background:var(--na)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
.p-good{background:var(--goodbg);color:var(--good)} .p-partial{background:var(--partialbg);color:var(--partial)}
.p-gap{background:var(--gapbg);color:var(--gap)} .p-na{background:var(--nabg);color:var(--muted)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar input[type=search]{padding:7px 11px;border:1px solid var(--line);border-radius:8px;min-width:240px}
.muted{color:var(--muted)}
.empty{text-align:center;padding:60px 20px}
.empty h1{font-size:24px;margin:10px 0 6px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:28px auto 0;max-width:900px;text-align:left}
.steps .card{margin:0}
.steps b{display:block;margin-bottom:4px;color:var(--brand)}
/* coverage bars */
.cov{margin-bottom:14px}
.cov .top{display:flex;justify-content:space-between;gap:10px;margin-bottom:4px}
.cov .name{font-weight:600}
.track{position:relative;height:12px;background:#edf0f5;border-radius:6px;overflow:hidden}
.fill{height:100%;border-radius:6px}
.fill.good{background:var(--good)} .fill.partial{background:var(--partial)} .fill.gap{background:var(--gap)} .fill.na{background:var(--na)}
.cov .meta{font-size:12px;color:var(--muted);margin-top:3px}
/* stacked */
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:#edf0f5}
.stack div{height:100%}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
/* donut */
.donutwrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut{width:130px;height:130px;border-radius:50%;position:relative;flex:none}
.donut::after{content:"";position:absolute;inset:26px;background:#fff;border-radius:50%}
.donut span{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1;font-size:11px;color:var(--muted);text-align:center}
.donut span b{font-size:14px;color:var(--ink)}
.lg-row{display:flex;align-items:center;gap:6px;font-size:12.5px;margin:3px 0}
.lg-sw{width:10px;height:10px;border-radius:2px;flex:none}
/* client header */
.chead{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:19px}
.chead h1{margin:0;font-size:20px}
.facts{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:2px}
.facts b{color:var(--ink);font-weight:600}
.chead .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
/* editor */
.edit-wrap{overflow-x:auto}
.edit td{padding:4px 4px}
.edit input,.edit select{width:100%;min-width:80px;padding:5px 6px;border:1px solid transparent;border-radius:6px;background:transparent}
.edit input:hover,.edit select:hover{border-color:var(--line)}
.edit input:focus,.edit select:focus{outline:none;border-color:var(--brand2);background:#fff}
.edit input.n{text-align:right;min-width:95px}
.edit input.w{min-width:140px}
.edit .changed{background:#fff6d6;border-color:#f0d48a}
.actlist{margin:0;padding-left:18px}
.actlist li{margin:5px 0}
textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical}
.log td{font-size:12.5px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(15,25,45,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.open{display:flex}
.modal .box{background:#fff;border-radius:14px;max-width:560px;width:100%;padding:20px 22px;max-height:90vh;overflow:auto}
.modal h3{margin:0 0 4px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin:14px 0}
.form label{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.form input{padding:7px 9px;border:1px solid var(--line);border-radius:8px;color:var(--ink)}
.form .full{grid-column:1/-1}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1b2333;color:#fff;padding:9px 16px;border-radius:8px;opacity:0;transition:opacity .25s;z-index:60;pointer-events:none}
.toast.show{opacity:1}
/* ---------- client report ---------- */
.rep-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:7px 14px;cursor:pointer}
.seg button.on{background:var(--brand2);color:#fff}
.report{background:#fff;max-width:820px;margin:0 auto;padding:36px 42px;border-radius:6px;box-shadow:0 4px 24px rgba(20,40,80,.1)}
.r-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--brand);padding-bottom:14px;margin-bottom:18px;gap:16px}
.r-head h1{margin:0;color:var(--brand);font-size:22px}
.r-head .who{font-size:13px;color:var(--muted);margin-top:4px}
.r-head .who b{color:var(--ink);font-size:16px}
.r-head .meta{text-align:right;font-size:12.5px;color:var(--muted)}
.r-sec{margin:20px 0}
.r-sec h2{font-size:14.5px;color:var(--brand);margin:0 0 10px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.r-areas{display:grid;grid-template-columns:1fr 1fr;gap:10px 22px}
.r-area{border:1px solid var(--line);border-radius:10px;padding:10px 12px;break-inside:avoid}
.r-area .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px}
.r-area .name{font-weight:700}
.r-area .meta{font-size:12px;color:var(--muted);margin-top:5px}
.r-score{display:flex;gap:14px;align-items:center;background:var(--soft);border-radius:10px;padding:12px 16px}
.r-score .big{font-size:30px;font-weight:800;color:var(--brand)}
.r-table th{background:var(--soft);color:var(--brand)}
.r-table td,.r-table th{font-size:12px;padding:6px 7px}
.r-prem{display:flex;gap:12px}
.r-prem div{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.r-prem b{display:block;font-size:17px;color:var(--ink)}
.r-prem span{font-size:12px;color:var(--muted)}
.r-enh{list-style:none;padding-left:0}
.r-enh li{margin:6px 0}
.nw{white-space:nowrap}
.r-sign{display:flex;gap:40px;margin-top:34px}
.r-sign div{flex:1;border-top:1px solid var(--ink);padding-top:5px;font-size:12px;color:var(--muted)}
.r-disc{font-size:10.5px;color:var(--muted);margin-top:22px;border-top:1px solid var(--line);padding-top:8px}
.tag-new{font-size:10.5px;background:var(--partialbg);color:var(--partial);padding:1px 6px;border-radius:4px;font-weight:600}
@media (max-width:900px){.g2{grid-template-columns:1fr}.r-areas{grid-template-columns:1fr}.report{padding:22px 18px}.form{grid-template-columns:1fr}}
.grid>*{min-width:0}
/* phone */
@media screen and (max-width:600px){
  .topbar{gap:6px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top))}
  .brand{width:100%;font-size:15px}.brand small{display:none}
  .topbar .btn{padding:5px 9px;font-size:12.5px}
  main{padding:12px}
  .kpis{grid-template-columns:1fr 1fr;gap:8px}
  .kpi{padding:10px 12px}.kpi .v{font-size:19px}
  .card{padding:12px}
  .toolbar input[type=search]{min-width:0;width:100%}
  .r-sec{overflow-x:auto}
  .r-head{flex-wrap:wrap;gap:8px}
  .r-prem{flex-wrap:wrap}
}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff}
  .topbar,.no-print,.toast,.modal{display:none!important}
  main{padding:0;max-width:none}
  .report{box-shadow:none;padding:0;max-width:none}
  .r-areas{grid-template-columns:1fr 1fr}
  .r-sec,.r-table tr{break-inside:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand" onclick="go('portfolio')">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M12 2l8 3v6c0 5-3.4 9.4-8 11-4.6-1.6-8-6-8-11V5l8-3z" fill="#fff" opacity=".95"/><path d="M8 12.5l2.6 2.6L16 9.7" stroke="#1f4e8c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div>Customer's Policy Summary<small>Annual review: coverage, premium, nominee &amp; purpose</small></div>
  </div>
  <label class="btn primary">📂 Load Excel / PDF<input type="file" id="file" accept=".xlsx,.xls,.csv,.pdf,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv,application/pdf" hidden></label>
  <button class="btn" onclick="loadSample()">Try sample data</button>
  <button class="btn" onclick="downloadTemplate()">⬇ Excel template</button>
  <button class="btn" onclick="exportUpdated()">💾 Export updated Excel</button>
  <button class="btn" onclick="openSettings()">⚙ Settings</button>
</div>

<main id="app"></main>

<div class="modal" id="settings">
  <div class="box">
    <h3>Settings</h3>
    <div class="muted">Advisor details appear on the client report. Coverage targets drive the gap analysis.</div>
    <div class="form">
      <label class="full">Advisor name<input id="st-advisor"></label>
      <label>Branch / company<input id="st-branch"></label>
      <label>Contact no.<input id="st-phone"></label>
      <label>Currency<input id="st-currency"></label>
      <label>Life cover target (× annual income)<input id="st-lifeMult" type="number" step="0.5"></label>
      <label>Critical illness target (× annual income)<input id="st-ciMult" type="number" step="0.5"></label>
      <label>Medical annual limit target (amount)<input id="st-medMin" type="number" step="10000"></label>
      <label>Education fund per dependant (amount)<input id="st-eduPerChild" type="number" step="10000"></label>
      <label>Retirement fund target (× annual income)<input id="st-retireMult" type="number" step="0.5"></label>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn" onclick="closeSettings()">Cancel</button>
      <button class="btn primary" onclick="saveSettings()">Save</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ================= configuration ================= */
const AREAS=['life','ci','medical','savings','retirement'];
const AREA_EN={life:'Life / Death',ci:'Critical Illness',medical:'Medical / Hospital',savings:'Education / Savings',retirement:'Retirement'};
const STATUSES=['Active','Proposed','Lapsed','Surrendered','Matured'];
const FREQS={Monthly:12,Quarterly:4,'Half-yearly':2,Yearly:1,Single:0};
const PALETTE=['#2f6fbf','#1e8e5a','#c98a0b','#8e44ad','#c8372d','#16a2b8','#6c7a89'];

// [field, template header, accepted header aliases (normalised)]
const COLS=[
 ['clientId','Client ID',['clientid','customerid','cif','icno','nric','clientno','customerno']],
 ['clientName','Client Name',['clientname','customername','name','policyowner','owner','ownername']],
 ['age','Age',['age']],
 ['income','Annual Income',['annualincome','income','yearlyincome']],
 ['dependants','Dependants',['dependants','dependents','children','noofchildren','noofdependants']],
 ['lastReview','Last Review Date',['lastreviewdate','lastreview','reviewdate']],
 ['policyNo','Policy No',['policyno','policynumber','policy','contractno','certificateno']],
 ['plan','Plan Name',['planname','plan','product','productname']],
 ['type','Policy Type',['policytype','type','category','producttype']],
 ['life','Life Cover',['lifecover','sumassured','deathbenefit','life','basicsumassured']],
 ['ci','CI Cover',['cicover','criticalillness','ci','cisumassured','criticalillnesscover']],
 ['medical','Medical Limit',['medicallimit','medical','hospital','annuallimit','medicalcard']],
 ['savings','Education/Savings Value',['educationsavingsvalue','savingsvalue','savings','education','maturityvalue']],
 ['retirement','Retirement Value',['retirementvalue','retirement','retirementfund']],
 ['premium','Premium',['premium','premiumamount','modalpremium','installmentpremium']],
 ['frequency','Frequency',['frequency','paymentmode','mode','premiumfrequency','paymentfrequency']],
 ['nominee','Nominee',['nominee','beneficiary','nomineename','beneficiaryname']],
 ['nomineeRel','Nominee Relationship',['nomineerelationship','relationship','nomineerelation','beneficiaryrelationship']],
 ['purpose','Purpose',['purpose','policypurpose','objective']],
 ['start','Start Date',['startdate','commencementdate','inceptiondate','start','effectivedate']],
 ['maturity','Maturity Date',['maturitydate','expirydate','maturity']],
 ['status','Status',['status','policystatus']],
];
const NUM=new Set(['age','income','dependants','life','ci','medical','savings','retirement','premium']);
const FIELD_LABEL=Object.fromEntries(COLS.map(c=>[c[0],c[1]]));

/* ================= state ================= */
const DEFAULTS={advisor:'',branch:'',phone:'',currency:'RM',lifeMult:10,ciMult:5,medMin:1000000,eduPerChild:150000,retireMult:10};
let S=Object.assign({},DEFAULTS);
try{Object.assign(S,JSON.parse(localStorage.getItem('cps-settings')||'{}'))}catch(e){}
let policies=[];        // flat list of policy rows
let changes=[];         // {clientId, policyNo, field, from, to, at}
let notes={};           // clientId -> advisor notes
let changedCells=new Set();
let view={name:'portfolio',clientId:null,lang:'en',q:'',dueOnly:false};
let dirty=false;

/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>S.currency+' '+Math.round(n||0).toLocaleString('en-MY');
const normKey=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,'');
const pad=n=>String(n).padStart(2,'0');
const isoDate=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>isoDate(new Date());
function fmtDate(iso){if(!iso)return'—';const[y,m,d]=iso.split('-');return `${d}/${m}/${y}`}
function addYear(iso){if(!iso)return'';const d=new Date(iso+'T00:00:00');d.setFullYear(d.getFullYear()+1);return isoDate(d)}
function daysUntil(iso){if(!iso)return null;return Math.round((new Date(iso+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5)}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2400)}
function toNum(v){if(v===null||v===undefined||v==='')return 0;if(typeof v==='number')return v;const n=parseFloat(String(v).replace(/[^0-9.\-]/g,''));return isNaN(n)?0:n}
function toDate(v){
  if(v===null||v===undefined||v==='')return'';
  if(v instanceof Date&&!isNaN(v))return isoDate(v);
  if(typeof v==='number'){const d=new Date(Math.round((v-25569)*864e5));return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`}
  const s=String(v).trim();
  let m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);           // dd/mm/yyyy (Malaysian format)
  if(m)return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;
  m=s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
  if(m)return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  const d=new Date(s);return isNaN(d)?'':isoDate(d);
}
function normFreq(v){const s=normKey(v);if(!s)return'Yearly';if(s.startsWith('month'))return'Monthly';if(s.startsWith('quart'))return'Quarterly';if(s.startsWith('half')||s.startsWith('semi'))return'Half-yearly';if(s.startsWith('single')||s.startsWith('lump')||s==='sp')return'Single';return'Yearly'}
function normStatus(v){const s=normKey(v);if(!s||s.startsWith('inforce')||s.startsWith('active'))return'Active';if(s.startsWith('laps'))return'Lapsed';if(s.startsWith('surr'))return'Surrendered';if(s.startsWith('matur'))return'Matured';if(s.startsWith('prop')||s.startsWith('pend'))return'Proposed';return'Active'}
const isActive=p=>p.status==='Active';
const annualPrem=p=>(p.premium||0)*(FREQS[p.frequency]??1);

/* ================= import ================= */
function rowsToPolicies(rows){
  if(!rows.length)return[];
  const headerMap={};
  Object.keys(rows[0]).forEach(h=>{
    const k=normKey(h);
    const col=COLS.find(c=>normKey(c[1])===k||c[2].includes(k));
    if(col&&!Object.values(headerMap).includes(col[0]))headerMap[h]=col[0];
  });
  return rows.map(r=>{
    const p={};COLS.forEach(c=>p[c[0]]=NUM.has(c[0])?0:'');
    for(const h in r){const f=headerMap[h];if(!f)continue;p[f]=NUM.has(f)?toNum(r[h]):String(r[h]??'').trim()}
    p.lastReview=toDate(r[Object.keys(headerMap).find(h=>headerMap[h]==='lastReview')]);
    p.start=toDate(r[Object.keys(headerMap).find(h=>headerMap[h]==='start')]);
    p.maturity=toDate(r[Object.keys(headerMap).find(h=>headerMap[h]==='maturity')]);
    p.frequency=normFreq(p.frequency);p.status=normStatus(p.status);
    if(!p.clientId)p.clientId=p.clientName;
    return p;
  }).filter(p=>p.clientId||p.policyNo);
}
function parseCSV(text){
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'&&text[i+1]==='"'){cell+='"';i++}else if(ch==='"')q=false;else cell+=ch}
    else if(ch==='"')q=true;else if(ch===','){row.push(cell);cell=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}
    else cell+=ch}
  if(cell||row.length){row.push(cell);rows.push(row)}
  const [h,...body]=rows.filter(r=>r.some(c=>c.trim()));
  return body.map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]??''])));
}

function loadScript(src){return new Promise((ok,fail)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>fail(new Error('could not load '+src));document.head.appendChild(s)})}
async function loadPdfLib(){
  if(!window.pdfjsLib){
    try{await loadScript('pdf.min.js')}catch(e){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js')}
  }
  // the worker is also loaded on the page so PDFs still open when the app runs from a local file
  if(!window.pdfjsWorker){try{await loadScript('pdf.worker.min.js')}catch(e){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js')}}
  pdfjsLib.GlobalWorkerOptions.workerSrc=document.querySelector('script[src$="pdf.worker.min.js"]').src;
  return pdfjsLib;
}
const fieldOf=label=>{const k=normKey(label);if(!k||k.length>40)return null;const c=COLS.find(c=>normKey(c[1])===k||c[2].includes(k));return c?c[0]:null};
// PDF text -> lines of cells, using each word's position on the page
async function pdfLines(buf){
  const lib=await loadPdfLib();
  const doc=await lib.getDocument({data:new Uint8Array(buf),isEvalSupported:false}).promise;
  const pages=[];
  for(let n=1;n<=doc.numPages;n++){
    const items=(await (await doc.getPage(n)).getTextContent()).items.filter(i=>i.str.trim());
    const lines=[];
    items.map(i=>({x:i.transform[4],y:i.transform[5],w:i.width,h:Math.abs(i.transform[3])||10,s:i.str}))
      .sort((a,b)=>b.y-a.y||a.x-b.x)
      .forEach(it=>{const L=lines.find(l=>Math.abs(l.y-it.y)<=Math.max(2,it.h*.35));L?L.items.push(it):lines.push({y:it.y,items:[it]})});
    pages.push(lines.sort((a,b)=>b.y-a.y).map(l=>{
      const its=l.items.sort((a,b)=>a.x-b.x),cells=[];
      its.forEach(it=>{const c=cells[cells.length-1];
        if(c&&it.x-(c.x2)<it.h*0.9){c.s+=(it.x-c.x2>it.h*.15?' ':'')+it.s;c.x2=it.x+it.w}
        else cells.push({x:it.x,x2:it.x+it.w,s:it.s})});
      cells.forEach(c=>c.s=c.s.replace(/\s+/g,' ').trim());
      return cells;
    }));
  }
  return pages;
}
function pdfTableRows(pages){
  // a header row is a line where at least 4 cells are known column names
  let header=null;const rows=[];
  for(const lines of pages)for(const cells of lines){
    const known=cells.filter(c=>fieldOf(c.s)).length;
    if(known>=4&&known>=cells.length*.6){header=cells.map(c=>({x:c.x,x2:c.x2,name:c.s}));continue}
    if(!header)continue;
    const r={};header.forEach(h=>r[h.name]='');
    cells.forEach(c=>{const mid=(c.x+c.x2)/2;let best=header[0],d=1e9;
      header.forEach(h=>{const dd=mid>=h.x-4&&mid<=h.x2+4?0:Math.min(Math.abs(mid-h.x),Math.abs(mid-h.x2));if(dd<d){d=dd;best=h}});
      r[best.name]=r[best.name]?r[best.name]+' '+c.s:c.s});
    const filled=Object.values(r).filter(v=>v).length;
    if(filled>=Math.min(3,header.length))rows.push(r);
    else if(rows.length&&filled){const prev=rows[rows.length-1];for(const k in r)if(r[k])prev[k]=(prev[k]+' '+r[k]).trim()}   // text wrapped onto the next line
  }
  return rows;
}
function pdfStatementRows(pages){
  // "Label: value" or "Label   value" pairs; a new Policy No starts a new policy; client details carry over
  const recs=[];let cur={},client={};
  const CLIENT=new Set(['clientId','clientName','age','income','dependants','lastReview']);
  const put=(f,v)=>{v=String(v).trim();if(!v)return;
    if(f==='policyNo'&&cur.policyNo){recs.push(cur);cur={}}
    if(CLIENT.has(f)){client[f]=v}
    if(cur[f]===undefined)cur[f]=v};
  for(const lines of pages)for(const cells of lines){
    for(let i=0;i<cells.length;i++){
      const s=cells[i].s,m=s.match(/^([^:：]{2,40})\s*[:：]\s*(.*)$/);
      if(m&&fieldOf(m[1])){const f=fieldOf(m[1]);if(m[2])put(f,m[2]);else if(cells[i+1]&&!fieldOf(cells[i+1].s.replace(/[:：]\s*$/,''))){put(f,cells[i+1].s);i++}continue}
      const f=fieldOf(s.replace(/[:：]\s*$/,''));
      if(f&&cells[i+1]&&!fieldOf(cells[i+1].s.replace(/[:：]\s*$/,''))){put(f,cells[i+1].s);i++}
    }
  }
  if(cur.policyNo)recs.push(cur);
  return recs.map(r=>{const o={};COLS.forEach(c=>o[c[1]]=r[c[0]]??client[c[0]]??'');return o});
}
async function pdfToRows(buf){
  const pages=await pdfLines(buf);
  if(!pages.some(l=>l.length))throw new Error('This PDF has no readable text (it may be a scanned image). Please use the Excel export instead.');
  const t=pdfTableRows(pages);
  if(t.length)return t;
  return pdfStatementRows(pages);
}

function readFileNow(f){return new Promise((ok,fail)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>fail(r.error||new Error('read failed'));r.readAsArrayBuffer(f)})}
$('#file').addEventListener('change',async e=>{

/* ================= analysis ================= */
function clients(){
  const map=new Map();
  policies.forEach((p,i)=>{
    const id=p.clientId||'(no id)';
    if(!map.has(id))map.set(id,{id,name:'',age:0,income:0,dependants:0,lastReview:'',policies:[]});
    const c=map.get(id);
    c.policies.push(Object.assign(p,{_i:i}));
    if(!c.name&&p.clientName)c.name=p.clientName;
    if(!c.age&&p.age)c.age=p.age;
    if(!c.income&&p.income)c.income=p.income;
    if(!c.dependants&&p.dependants)c.dependants=p.dependants;
    if(p.lastReview&&p.lastReview>c.lastReview)c.lastReview=p.lastReview;
  });
  return [...map.values()].map(c=>Object.assign(c,analyse(c)));
}
function analyse(c){
  const act=c.policies.filter(isActive);
  const inc=c.income||0;
  const target={life:inc*S.lifeMult,ci:inc*S.ciMult,medical:+S.medMin,savings:S.eduPerChild*(c.dependants||0),retirement:inc*S.retireMult};
  const areas=AREAS.map(k=>{
    const have=act.reduce((s,p)=>s+(p[k]||0),0),t=target[k];
    const pct=t>0?have/t:(have>0?1:null);
    const status=pct===null?'na':pct>=1?'good':pct>=.5?'partial':'gap';
    return{key:k,have,target:t,pct,status,shortfall:Math.max(0,t-have)};
  });
  const annual=act.reduce((s,p)=>s+annualPrem(p),0);
  const actions=[];
  areas.forEach(a=>{if(a.status==='gap'||a.status==='partial')actions.push({k:'act_'+a.key,v:a.shortfall,sev:a.status})});
  act.forEach(p=>{if(!p.nominee)actions.push({k:'act_nominee',v:p.policyNo,sev:'gap'})});
  c.policies.filter(p=>p.status==='Lapsed').forEach(p=>actions.push({k:'act_lapsed',v:p.policyNo,sev:'partial'}));
  if(inc&&annual/inc>.15)actions.push({k:'act_afford',sev:'partial'});
  const scored=areas.filter(a=>a.pct!==null);
  const score=scored.length?Math.round(scored.reduce((s,a)=>s+Math.min(a.pct,1),0)/scored.length*100):0;
  const nextReview=c.lastReview?addYear(c.lastReview):'';
  return{areas,annual,actions,score,nextReview,activeCount:act.length};
}

function fmtVal(f,v){if(NUM.has(f)&&f!=='age'&&f!=='dependants')return v===''||v===null?'—':money(v);return v===''||v==null?'—':v}

// live editing
document.addEventListener('change',e=>{
  const t=e.target;if(t.dataset.i===undefined)return;
  const p=policies[+t.dataset.i],f=t.dataset.f;
  const nv=NUM.has(f)?toNum(t.value):t.value.trim();
  if(nv===p[f])return;
  changes.push({clientId:p.clientId,policyNo:p.policyNo,field:f,from:p[f],to:nv,at:new Date().toLocaleString('en-GB')});
  p[f]=nv;changedCells.add(p._i+'|'+f);t.classList.add('changed');dirty=true;
  if(NUM.has(f))t.value=nv||'';
  renderAnalysis();renderLog();
});
document.addEventListener('input',e=>{if(e.target.id==='notes'){notes[view.clientId]=e.target.value;dirty=true}});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});

function addPolicy(){
  const c=getClient(),base=c.policies[0];
  const p={};COLS.forEach(k=>p[k[0]]=NUM.has(k[0])?0:'');
  Object.assign(p,{clientId:c.id,clientName:c.name,age:c.age,income:c.income,dependants:c.dependants,lastReview:c.lastReview,
    policyNo:'NEW-'+(changes.length+policies.length+1),plan:'',type:'',status:'Proposed',frequency:'Monthly',start:today()});
  policies.push(p);
  changes.push({clientId:c.id,policyNo:p.policyNo,field:'status',from:'',to:'Proposed',at:new Date().toLocaleString('en-GB')});
  dirty=true;renderClient();toast('Proposed policy added. Fill in plan, premium and cover.');
}
function markReviewed(){
  const c=getClient(),t=today();
  c.policies.forEach(p=>{if(p.lastReview!==t){p.lastReview=t}});
  changes.push({clientId:c.id,policyNo:'(all)',field:'lastReview',from:c.lastReview,to:t,at:new Date().toLocaleString('en-GB')});
  dirty=true;renderClient();toast('Review date set to today. Next review in 12 months.');
}
