<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>W2G Policy Summary Pro</title>
<meta name="theme-color" content="#1f4e8c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="app-icon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="W2G Policy">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="xlsx.full.min.js"></script>
<script>window.XLSX||document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"><\/script>')</script>
<style>
:root{
  --bg:#f4f6fa; --card:#fff; --ink:#1b2333; --muted:#677189; --line:#e3e7ef;
  --brand:#1f4e8c; --brand2:#2f6fbf; --soft:#eaf1fb;
  --good:#1e8e5a; --goodbg:#e3f5ec; --partial:#c98a0b; --partialbg:#fdf3dc;
  --gap:#c8372d; --gapbg:#fbe5e3; --na:#9aa3b5; --nabg:#eef0f4;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 20px;background:var(--brand);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;margin-right:auto;cursor:pointer}
.brand small{display:block;font-weight:400;font-size:11.5px;opacity:.8}
.pro{display:inline-block;background:#EF9F27;color:#412402;font-size:10.5px;font-weight:800;letter-spacing:.8px;padding:1px 6px;border-radius:4px;vertical-align:2px;margin-left:2px}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 13px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--brand2)}
.btn.primary{background:var(--brand2);border-color:var(--brand2);color:#fff}
.btn.primary:hover{background:var(--brand)}
.topbar .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#fff}
.topbar .btn:hover{background:rgba(255,255,255,.22)}
.topbar .btn.primary{background:#fff;color:var(--brand);border-color:#fff}
main{max-width:1280px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.card h2{margin:0 0 12px;font-size:15px}
.card h2 .sub{font-weight:400;color:var(--muted);font-size:12.5px;margin-left:6px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1.4fr 1fr}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .v{font-size:24px;font-weight:700;margin-top:2px}
.kpi .l{color:var(--muted);font-size:12.5px}
.kpi.warn .v{color:var(--gap)}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;background:#fafbfd;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--soft)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:3px;vertical-align:middle}
.s-good{background:var(--good)} .s-partial{background:var(--partial)} .s-gap{background:var(--gap)} .s-na{background:var(--na)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
.p-good{background:var(--goodbg);color:var(--good)} .p-partial{background:var(--partialbg);color:var(--partial)}
.p-gap{background:var(--gapbg);color:var(--gap)} .p-na{background:var(--nabg);color:var(--muted)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar input[type=search]{padding:7px 11px;border:1px solid var(--line);border-radius:8px;min-width:240px}
.muted{color:var(--muted)}
.empty{text-align:center;padding:60px 20px}
.empty h1{font-size:24px;margin:10px 0 6px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:28px auto 0;max-width:900px;text-align:left}
.steps .card{margin:0}
.steps b{display:block;margin-bottom:4px;color:var(--brand)}
/* coverage bars */
.cov{margin-bottom:14px}
.cov .top{display:flex;justify-content:space-between;gap:10px;margin-bottom:4px}
.cov .name{font-weight:600}
.track{position:relative;height:12px;background:#edf0f5;border-radius:6px;overflow:hidden}
.fill{height:100%;border-radius:6px}
.fill.good{background:var(--good)} .fill.partial{background:var(--partial)} .fill.gap{background:var(--gap)} .fill.na{background:var(--na)}
.cov .meta{font-size:12px;color:var(--muted);margin-top:3px}
/* stacked */
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:#edf0f5}
.stack div{height:100%}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
/* donut */
.donutwrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut{width:130px;height:130px;border-radius:50%;position:relative;flex:none}
.donut::after{content:"";position:absolute;inset:26px;background:#fff;border-radius:50%}
.donut span{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1;font-size:11px;color:var(--muted);text-align:center}
.donut span b{font-size:14px;color:var(--ink)}
.lg-row{display:flex;align-items:center;gap:6px;font-size:12.5px;margin:3px 0}
.lg-sw{width:10px;height:10px;border-radius:2px;flex:none}
/* client header */
.chead{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:19px}
.chead h1{margin:0;font-size:20px}
.facts{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:2px}
.facts b{color:var(--ink);font-weight:600}
.fact-in{padding:2px 6px;border:1px solid var(--line);border-radius:6px;color:var(--ink);font-weight:600;background:#fff}
.fact-in.changed{background:#fff6d6;border-color:#f0d48a}
.chead .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
/* editor */
.edit-wrap{overflow-x:auto}
.edit td{padding:4px 4px}
.edit input,.edit select{width:100%;min-width:80px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:#fff}
.edit input:hover,.edit select:hover{border-color:var(--brand2)}
.pen{border:1px solid var(--line);background:#fff;color:var(--brand2);border-radius:6px;padding:1px 8px;font-size:12px;font-weight:600;cursor:pointer;vertical-align:middle;margin-left:4px}
.pen:hover{border-color:var(--brand2);background:var(--soft)}
.prof-edit{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-bottom:6px}
.prof-edit label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:2px}
.prof-edit input{padding:6px 8px;border:1px solid var(--brand2);border-radius:6px;font-weight:600;min-width:200px}
.r-matrix td,.r-matrix th{font-size:11.5px;padding:5px 6px}
.r-matrix tr.off td{opacity:.55}
.r-matrix tfoot td{font-weight:700;background:var(--soft);color:var(--brand);border-top:2px solid var(--brand)}
.r-count{font-weight:400;font-size:12px;color:var(--muted);margin-left:6px}
.pdf-stage{position:absolute;left:-12000px;top:0;width:704px;background:#fff}
.pdf-stage .report{width:704px!important;max-width:none!important;margin:0!important;padding:0!important;box-shadow:none!important;border:0!important}
.pdf-stage .r-sec{overflow:visible!important}
.pdf-stage .r-areas{grid-template-columns:1fr 1fr!important}
.pdf-stage .r-head,.pdf-stage .r-prem{flex-wrap:nowrap!important}
.drop-hint{margin:14px auto 0;max-width:640px;font-size:12.5px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:10px 14px;background:#fff}
body.dropping::after{content:"Drop Excel or PDF files to load them";position:fixed;inset:12px;z-index:100;display:flex;align-items:center;justify-content:center;border:3px dashed var(--brand2);border-radius:16px;background:rgba(234,241,251,.92);color:var(--brand);font-size:22px;font-weight:700;pointer-events:none}
.merge-hint{background:var(--partialbg);border-color:#f0d48a;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.merge-hint select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;max-width:100%;background:#fff}
.cov-edit{margin-top:8px;padding:10px;border:1px dashed var(--brand2);border-radius:8px;background:var(--soft);display:grid;gap:8px}
.cov-edit label{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px}
.cov-edit .amt{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.cov-edit input{width:130px;padding:5px 7px;border:1px solid var(--line);border-radius:6px;text-align:right;background:#fff}
.cash-big{font-size:26px;font-weight:700;color:var(--brand)}
.cov-edit input[type=date]{width:150px;text-align:left}
.r-areas>.r-area{min-width:0}
.r-area.wide{grid-column:1/-1}
.sublim{width:100%;margin-top:8px;border-collapse:collapse;font-size:12px}
.sublim th{font-size:11px;font-weight:600;color:var(--muted);background:none;padding:3px 6px;border-bottom:1px solid var(--line)}
.sublim td{padding:4px 6px;border-bottom:1px dashed var(--line)}
.sublim tr:last-child td{border-bottom:0}
.r-matrix .sub{font-size:10px;line-height:1.35;margin-top:2px}
.amt3{display:flex;gap:8px;flex-wrap:wrap}
.cov-edit .amt small{display:block;width:100%;font-size:10.5px;color:var(--muted)}
.cov-edit .amt3 .amt{flex-wrap:wrap;width:165px;column-gap:4px}
.cov-edit .amt3 input{width:128px}
.cov-edit input.changed{background:#fff6d6;border-color:#f0d48a}
.edit input:focus,.edit select:focus{outline:none;border-color:var(--brand2);background:#fff}
.edit input.n{text-align:right;min-width:95px}
.edit input.w{min-width:140px}
.edit .changed{background:#fff6d6;border-color:#f0d48a}
.actlist{margin:0;padding-left:18px}
.actlist li{margin:5px 0}
textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical}
.log td{font-size:12.5px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(15,25,45,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.open{display:flex}
.modal .box{background:#fff;border-radius:14px;max-width:560px;width:100%;padding:20px 22px;max-height:90vh;overflow:auto}
.modal h3{margin:0 0 4px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin:14px 0}
.form label{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.form input{padding:7px 9px;border:1px solid var(--line);border-radius:8px;color:var(--ink)}
.form .full{grid-column:1/-1}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1b2333;color:#fff;padding:9px 16px;border-radius:8px;opacity:0;transition:opacity .25s;z-index:60;pointer-events:none}
.toast.show{opacity:1}
/* ---------- client report ---------- */
.rep-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:7px 14px;cursor:pointer}
.seg button.on{background:var(--brand2);color:#fff}
.report{background:#fff;max-width:820px;margin:0 auto;padding:36px 42px;border-radius:6px;box-shadow:0 4px 24px rgba(20,40,80,.1)}
.r-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--brand);padding-bottom:14px;margin-bottom:18px;gap:16px}
.r-head h1{margin:0;color:var(--brand);font-size:22px}
.r-head .who{font-size:13px;color:var(--muted);margin-top:4px}
.r-head .who b{color:var(--ink);font-size:16px}
.r-head .meta{text-align:right;font-size:12.5px;color:var(--muted)}
.r-sec{margin:20px 0}
.r-sec h2{font-size:14.5px;color:var(--brand);margin:0 0 10px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.r-areas{display:grid;grid-template-columns:1fr 1fr;grid-auto-flow:row dense;gap:10px 22px}
.r-area{border:1px solid var(--line);border-radius:10px;padding:10px 12px;break-inside:avoid}
.r-area .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px}
.r-area .name{font-weight:700}
.r-area .meta{font-size:12px;color:var(--muted);margin-top:5px}
.r-score{display:flex;gap:14px;align-items:center;background:var(--soft);border-radius:10px;padding:12px 16px}
.r-score .big{font-size:30px;font-weight:800;color:var(--brand)}
.r-table th{background:var(--soft);color:var(--brand)}
.r-table td,.r-table th{font-size:12px;padding:6px 7px}
.r-prem{display:flex;gap:12px}
.r-prem div{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.r-prem b{display:block;font-size:17px;color:var(--ink)}
.r-prem span{font-size:12px;color:var(--muted)}
.r-enh{list-style:none;padding-left:0}
.r-enh li{margin:6px 0}
.nw{white-space:nowrap}
.r-sign{display:flex;gap:40px;margin-top:34px}
.r-sign div{flex:1;border-top:1px solid var(--ink);padding-top:5px;font-size:12px;color:var(--muted)}
.r-disc{font-size:10.5px;color:var(--muted);margin-top:22px;border-top:1px solid var(--line);padding-top:8px}
.tag-new{font-size:10.5px;background:var(--partialbg);color:var(--partial);padding:1px 6px;border-radius:4px;font-weight:600}
@media (max-width:900px){.g2{grid-template-columns:1fr}.r-areas{grid-template-columns:1fr}.report{padding:22px 18px}.form{grid-template-columns:1fr}}
.grid>*{min-width:0}
/* phone */
@media screen and (max-width:600px){
  .topbar{gap:6px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top))}
  .brand{width:100%;font-size:15px}.brand small{display:none}
  .topbar .btn{padding:5px 9px;font-size:12.5px}
  main{padding:12px}
  .kpis{grid-template-columns:1fr 1fr;gap:8px}
  .kpi{padding:10px 12px}.kpi .v{font-size:19px}
  .card{padding:12px}
  .toolbar input[type=search]{min-width:0;width:100%}
  .r-sec{overflow-x:auto}
  .r-head{flex-wrap:wrap;gap:8px}
  .r-prem{flex-wrap:wrap}
}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff}
  .topbar,.no-print,.toast,.modal{display:none!important}
  main{padding:0;max-width:none}
  .report{box-shadow:none;padding:0;max-width:none}
  .r-areas{grid-template-columns:1fr 1fr}
  .r-sec,.r-table tr{break-inside:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand" onclick="go('portfolio')">
    <img src="app-icon.png" width="40" height="40" alt="" style="display:block">
    <div>W2G Policy Summary <span class="pro">PRO</span><small>Annual review: coverage, premium, nominee &amp; purpose</small></div>
  </div>
  <label class="btn primary" title="You can select several PDFs at once, or drag them onto the window">📂 Load Excel / PDF<input type="file" id="file" multiple accept=".xlsx,.xls,.csv,.pdf,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv,application/pdf" hidden></label>
  <button class="btn" onclick="loadSample()">Try sample data</button>
  <button class="btn" onclick="downloadTemplate()">⬇ Excel template</button>
  <button class="btn" onclick="exportUpdated()">💾 Export updated Excel</button>
  <button class="btn" onclick="openSettings()">⚙ Settings</button>
</div>

<main id="app"></main>
<datalist id="lim-opts"><option value="Unlimited"></datalist>

<div class="modal" id="settings">
  <div class="box">
    <h3>Settings</h3>
    <div class="muted">Advisor details appear on the client report. Coverage targets drive the gap analysis.</div>
    <div class="form">
      <label class="full">Advisor name<input id="st-advisor"></label>
      <label>Branch / company<input id="st-branch"></label>
      <label>Contact no.<input id="st-phone"></label>
      <label>Currency<input id="st-currency"></label>
      <label>Life cover target (× annual income)<input id="st-lifeMult" type="number" step="0.5"></label>
      <label>Life cover minimum benchmark (amount)<input id="st-lifeMin" type="number" step="50000"></label>
      <label>TPD target (× annual income)<input id="st-tpdMult" type="number" step="0.5"></label>
      <label>TPD minimum benchmark (amount)<input id="st-tpdMin" type="number" step="50000"></label>
      <label>Critical illness target (× annual income)<input id="st-ciMult" type="number" step="0.5"></label>
      <label>Critical illness minimum benchmark (amount)<input id="st-ciMin" type="number" step="50000"></label>
      <label>Medical annual limit target (amount)<input id="st-medMin" type="number" step="10000"></label>
      <label>Personal accident target (amount)<input id="st-paMin" type="number" step="50000"></label>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn" onclick="closeSettings()">Cancel</button>
      <button class="btn primary" onclick="saveSettings()">Save</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ================= configuration ================= */
const AREAS=['life','tpd','ci','medical','pa'];
const AREA_EN={life:'Life / Death',tpd:'Total Permanent Disability',ci:'Critical Illness',medical:'Medical / Hospital',pa:'Personal Accident'};
const STATUSES=['Active','Proposed','Lapsed','Terminated','Surrendered','Matured'];
const FREQS={Monthly:12,Quarterly:4,'Half-yearly':2,Yearly:1,Single:0};
const PALETTE=['#2f6fbf','#1e8e5a','#c98a0b','#8e44ad','#c8372d','#16a2b8','#6c7a89'];

// [field, template header, accepted header aliases (normalised)]
const COLS=[
 ['clientId','Client ID',['clientid','customerid','cif','icno','nric','clientno','customerno']],
 ['clientName','Client Name',['clientname','customername','name','policyowner','owner','ownername']],
 ['age','Age',['age']],
 ['income','Annual Income',['annualincome','income','yearlyincome']],
 ['dependants','Dependants',['dependants','dependents','children','noofchildren','noofdependants']],
 ['lastReview','Last Review Date',['lastreviewdate','lastreview','reviewdate']],
 ['policyNo','Policy No',['policyno','policynumber','policy','contractno','certificateno']],
 ['plan','Plan Name',['planname','plan','product','productname']],
 ['type','Policy Type',['policytype','type','category','producttype']],
 ['life','Life Cover',['lifecover','sumassured','deathbenefit','life','basicsumassured']],
 ['tpd','TPD Cover',['tpdcover','tpd','totalpermanentdisability','totalandpermanentdisability','tpdsumassured','disabilitycover']],
 ['ci','CI Cover',['cicover','criticalillness','ci','cisumassured','criticalillnesscover']],
 ['pa','PA Cover',['pacover','personalaccident','personalaccidentcover','accident','accidentcover','pasumassured','pa']],
 ['waiver','Waiver of Premium',['waiverofpremium','waiver','wop','payorbenefit','payorwaiver','premiumwaiver']],
 ['hospIncome','Hospital Income',['hospitalincome','hospitalincomeperday','dailyhospitalincome','hospitalcash','hospitalcashbenefit','hib','hospitalbenefit']],
 ['medical','Medical Limit',['medicallimit','medical','hospital','annuallimit','medicalcard','annualmedicallimit']],
 ['medLifetime','Lifetime Limit',['lifetimelimit','lifetime','lifetimemedicallimit','overalllifetimelimit','lifetimelimitamount']],
 ['roomBoard','Room & Board',['roomboard','roomandboard','roomboardperday','roomandboardperday','rb','dailyroomandboard','roomboardlimit','roomrate']],
 ['premium','Premium',['premium','premiumamount','modalpremium','installmentpremium']],
 ['frequency','Frequency',['frequency','paymentmode','mode','premiumfrequency','paymentfrequency']],
 ['nominee','Nominee',['nominee','beneficiary','nomineename','beneficiaryname']],
 ['nomineeRel','Nominee Relationship',['nomineerelationship','relationship','nomineerelation','beneficiaryrelationship']],
 ['purpose','Purpose',['purpose','policypurpose','objective']],
 ['start','Start Date',['startdate','commencementdate','inceptiondate','start','effectivedate']],
 ['maturity','Maturity Date',['maturitydate','expirydate','maturity']],
 ['cashValue','Cash Value',['cashvalue','totalcashvalue','surrendervalue','netsurrendervalue','cashsurrendervalue','fundvalue','policyvalue','csv']],
 ['cashAsAt','Cash Value As At',['cashvalueasat','cashvaluedate','valuationdate','valueasat']],
 ['status','Status',['status','policystatus']],
];
const NUM=new Set(['age','income','dependants','life','tpd','ci','medical','medLifetime','roomBoard','hospIncome','pa','premium','cashValue']);
// waiver of premium is Yes / No / blank (not known)
const normYesNo=v=>{const s=String(v??'').trim().toLowerCase();return!s?'':/^(y|ya|true|1|有|是)/.test(s)?'Yes':/^(n|tidak|false|0|无|否|没|沒)/.test(s)?'No':''};
// a medical lifetime limit can be an amount or 'Unlimited'
const UNLIMITED='Unlimited';

  if(typeof v==='number'){const d=new Date(Math.round((v-25569)*864e5));return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`}
  const s=String(v).trim();
  let m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);           // dd/mm/yyyy (Malaysian format)
  if(m)return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;

function parseCSV(text){
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'&&text[i+1]==='"'){cell+='"';i++}else if(ch==='"')q=false;else cell+=ch}
    else if(ch==='"')q=true;else if(ch===','){row.push(cell);cell=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}
    else cell+=ch}
  if(cell||row.length){row.push(cell);rows.push(row)}
  const [h,...body]=rows.filter(r=>r.some(c=>c.trim()));
  return body.map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]??''])));
}

const fieldOf=label=>{const k=normKey(label);if(!k||k.length>40)return null;const c=COLS.find(c=>normKey(c[1])===k||c[2].includes(k));return c?c[0]:null};
// PDF text -> lines of cells, using each word's position on the page
async function pdfLines(buf){
  const lib=await loadPdfLib();
  const doc=await lib.getDocument({data:new Uint8Array(buf),isEvalSupported:false}).promise;
  const pages=[];
  for(let n=1;n<=doc.numPages;n++){
    const items=(await (await doc.getPage(n)).getTextContent()).items.filter(i=>i.str.trim());
    const lines=[];
    items.map(i=>({x:i.transform[4],y:i.transform[5],w:i.width,h:Math.abs(i.transform[3])||10,s:i.str}))
      .sort((a,b)=>b.y-a.y||a.x-b.x)
      .forEach(it=>{const L=lines.find(l=>Math.abs(l.y-it.y)<=Math.max(2,it.h*.35));L?L.items.push(it):lines.push({y:it.y,items:[it]})});
    pages.push(lines.sort((a,b)=>b.y-a.y).map(l=>{
      const its=l.items.sort((a,b)=>a.x-b.x),cells=[];
      its.forEach(it=>{const c=cells[cells.length-1];
        if(c&&it.x-(c.x2)<it.h*0.9){c.s+=(it.x-c.x2>it.h*.15?' ':'')+it.s;c.x2=it.x+it.w}
        else cells.push({x:it.x,x2:it.x+it.w,s:it.s})});
      cells.forEach(c=>c.s=c.s.replace(/\s+/g,' ').trim());
      return cells;
    }));
  }
  return pages;
}
function pdfTableRows(pages){
  // a header row is a line where at least 4 cells are known column names
  let header=null;const rows=[];
  for(const lines of pages)for(const cells of lines){
    const known=cells.filter(c=>fieldOf(c.s)).length;
    if(known>=4&&known>=cells.length*.6){header=cells.map(c=>({x:c.x,x2:c.x2,name:c.s}));continue}
    if(!header)continue;
    const r={};header.forEach(h=>r[h.name]='');
    cells.forEach(c=>{const mid=(c.x+c.x2)/2;let best=header[0],d=1e9;
      header.forEach(h=>{const dd=mid>=h.x-4&&mid<=h.x2+4?0:Math.min(Math.abs(mid-h.x),Math.abs(mid-h.x2));if(dd<d){d=dd;best=h}});
      r[best.name]=r[best.name]?r[best.name]+' '+c.s:c.s});
    const filled=Object.values(r).filter(v=>v).length;
    if(filled>=Math.min(3,header.length))rows.push(r);
    else if(rows.length&&filled){const prev=rows[rows.length-1];for(const k in r)if(r[k])prev[k]=(prev[k]+' '+r[k]).trim()}   // text wrapped onto the next line
  }
  return rows;
}
function pdfStatementRows(pages){
  // "Label: value" or "Label   value" pairs; a new Policy No starts a new policy; client details carry over
  const recs=[];let cur={},client={};
  const CLIENT=new Set(['clientId','clientName','age','income','dependants','lastReview']);
  const put=(f,v)=>{v=String(v).trim();if(!v)return;
    if(f==='policyNo'&&cur.policyNo){recs.push(cur);cur={}}
    if(CLIENT.has(f)){client[f]=v}
    if(cur[f]===undefined)cur[f]=v};
  for(const lines of pages)for(const cells of lines){
    for(let i=0;i<cells.length;i++){
      const s=cells[i].s,m=s.match(/^([^:：]{2,40})\s*[:：]\s*(.*)$/);
      if(m&&fieldOf(m[1])){const f=fieldOf(m[1]);if(m[2])put(f,m[2]);else if(cells[i+1]&&!fieldOf(cells[i+1].s.replace(/[:：]\s*$/,''))){put(f,cells[i+1].s);i++}continue}
      const f=fieldOf(s.replace(/[:：]\s*$/,''));
      if(f&&cells[i+1]&&!fieldOf(cells[i+1].s.replace(/[:：]\s*$/,''))){put(f,cells[i+1].s);i++}
    }
  }
  if(cur.policyNo)recs.push(cur);
  return recs.map(r=>{const o={};COLS.forEach(c=>o[c[1]]=r[c[0]]??client[c[0]]??'');return o});
}
// Great Eastern ePartner "Policy Detail Information" printout (one policy per PDF)
function benefitArea(name,isBasic){
  const n=name.toUpperCase();
  if(/WAIVER|PAYOR|PAYER/.test(n))return null;
  if(/HOSPITAL\s*(INCOME|CASH|BENEFIT)|HOSPITALI[SZ]ATION\s*(INCOME|BENEFIT)|DAILY\s*HOSPITAL/.test(n))return'hospIncome';
  if(/ACCIDENT|\bPA\b/.test(n)&&!isBasic)return'pa';
  if(/MEDIC|HOSPITAL|HEALTH|SURGIC|MEDIK/.test(n))return'medical';
  if(/\bTPD\b|PERMANENT DISAB|DISABILITY(?!\s*INCOME)/.test(n))return'tpd';   // disability income riders pay monthly, not a lump sum
  if(/CRITICAL|\bCI\b|CANCER|DREAD/.test(n))return'ci';
  if(isBasic||/LIFE|TERM|DEATH|PROTECT/.test(n))return'life';
  return null;
}
function pdfEPartnerRows(pages){
  const lines=pages.flat(),txt=l=>l.map(c=>c.s).join(' | ');
  const val=label=>{for(const l of lines)for(let i=0;i<l.length-1;i++)if(normKey(l[i].s)===normKey(label))return l[i+1].s;return''};
  const policyNo=(lines.map(txt).join('\n').match(/P\/N:\s*\|?\s*([A-Z0-9-]+)/i)||[])[1]||'';
  const owner=lines.find(l=>/^(proposer|policy ?owner)$/i.test(l[0]?.s))||lines.find(l=>/^life assured$/i.test(l[0]?.s))||[];
  const ownerTxt=txt(owner),name=owner[1]?.s||val('Name');
  const ic=(ownerTxt.match(/\b\d{6}-\d{2}-\d{4}\b/)||[])[0]||val('ID No');
  const dob=toDate((ownerTxt.match(/\b\d{2}\/\d{2}\/\d{4}\b/)||[])[0]||'');
  let age=0;if(dob){const b=new Date(dob+'T00:00:00'),t=new Date();age=t.getFullYear()-b.getFullYear()-((t.getMonth()<b.getMonth()||(t.getMonth()===b.getMonth()&&t.getDate()<b.getDate()))?1:0)}
  // benefit table: plan/rider name (may wrap onto following lines), sum assured, premium, dates
  const from=lines.findIndex(l=>/^BENEFIT DETAILS/i.test(l[0]?.s));
  const benefits=[];
  for(let i=from+1;from>=0&&i<lines.length;i++){
    const l=lines[i],t=txt(l);
    if(/^(ILP FUND DETAILS|POLICY VALUES|The 'Annual|Please refer)/i.test(l[0]?.s||''))break;
    const money=t.match(/\d{1,3}(?:,\d{3})*\.\d{2}/g)||[],dates=t.match(/\d{2}\/\d{2}\/\d{4}/g)||[];
    if(money.length&&dates.length>=2){
      benefits.push({name:((l[0].s.match(/^[A-Za-z][A-Za-z &\-\/]*[A-Za-z]/)||[''])[0]).trim(),sa:toNum(money[0]),prem:toNum(money[1]||0),
        end:dates.map(toDate).sort().pop(),ilp:/\(ILP/i.test(t)});
    }else if(benefits.length&&/^[A-Z][A-Z &\-\/]*$/.test(l[0]?.s||'')){benefits[benefits.length-1].name+=' '+l[0].s}
  }
  const cover={life:0,tpd:0,ci:0,medical:0,pa:0,hospIncome:0};
  benefits.forEach((b,i)=>{const a=benefitArea(b.name,i===0);if(a)cover[a]+=b.sa});
  // nominees: right-hand columns (Relationship, Name) under NOMINEE INFORMATION;
  // assignee/trustee: left-hand columns (Role, Name), used when there is no nominee
  const noms=[],rels=[],assignees=[];
  const hi=lines.findIndex((l,i)=>i>0&&/NOMINEE INFORMATION/i.test(txt(lines[i-1]))&&l.some(c=>/^relationship$/i.test(c.s)));
  if(hi>=0){
    const h=lines[hi],relX=h.find(c=>/^relationship$/i.test(c.s)).x,nameX=h.filter(c=>/^name$/i.test(c.s)).pop()?.x??relX+100;
    const vcX=h.find(c=>/^vc$/i.test(c.s))?.x,split=vcX!==undefined&&vcX<relX?(vcX+relX)/2:relX-30;   // left = assignee/trustee, right = nominee
    for(let i=hi+1;i<lines.length;i++){
      const l=lines[i];if(/^(Trust Created|\*Explanatory|ALTERNATE|AGENT)/i.test(l[0]?.s||''))break;
      let r='',n='';const left=l.filter(c=>c.x<split);
      l.forEach(c=>{if(c.x<split)return;Math.abs(c.x-relX)<Math.abs(c.x-nameX)?r=c.s:n=c.s});
      if(n){noms.push(n);rels.push(r)}
      if(left.length>=2&&!/^[YN]$/.test(left[1].s))assignees.push({role:left[0].s,name:left[1].s});
    }
  }
  if(!noms.length)assignees.forEach(a=>{noms.push(`${a.name} (${a.role})`);rels.push(a.role)});
  const all=lines.map(txt).join('\n');
  const totalPrem=toNum(val('Total Installment Premium')||val('Installment Premium'));
  // cash value from POLICY VALUES: net surrender value, else fund value (ILP), else gross surrender value
  const cashValue=toNum(val('Net Surrender Value'))||toNum(val('Total Investment Value/Account 1 Value'))||toNum(val('Gross Surrender Value'));
  const asAt=(all.match(/P\/N:[^\n]*?as at\s*(\d{2}\/\d{2}\/\d{4})/i)||[])[1]||'';
  const row={};COLS.forEach(c=>row[c[1]]='');
  Object.assign(row,{'Client ID':ic||name,'Client Name':name,'Age':age,'Policy No':policyNo,
    'Plan Name':(benefits[0]?.name||'')+(benefits.length>1?` (+${benefits.length-1} rider${benefits.length>2?'s':''})`:''),
    // the page's menu always mentions ILP, so look for real fund holdings or "(ILP lapse)" status instead
    'Policy Type':/^ILP FUND DETAILS/im.test(all)||benefits.some(b=>b.ilp)?'Investment-linked':'Traditional',
    'Life Cover':cover.life,'TPD Cover':cover.tpd,'CI Cover':cover.ci,'Medical Limit':cover.medical,'PA Cover':cover.pa,'Hospital Income':cover.hospIncome,
    'Waiver of Premium':benefits.some(b=>/WAIVER|PAYOR|PAYER/i.test(b.name))?'Yes':'No',
    // a fully paid or terminated policy shows 0.00 in total: fall back to the plan's own premiums
    'Premium':totalPrem||benefits.reduce((s,b)=>s+b.prem,0),'Frequency':val('Payment Frequency'),
    'Nominee':noms.join(', '),'Nominee Relationship':rels.join(', '),
    'Start Date':val('Risk Commencement Date')||val('Policy Issue Date'),'Maturity Date':benefits[0]?.end?fmtDate(benefits[0].end):'',
    'Cash Value':cashValue,'Cash Value As At':asAt,
    'Status':val('Policy Status')});
  return policyNo?[row]:[];
}
async function pdfToRows(buf){
  const pages=await pdfLines(buf);
  if(!pages.some(l=>l.length))throw new Error('This PDF has no readable text (it may be a scanned image). Please use the Excel export instead.');
  if(pages.flat().some(l=>/Policy Detail Information for P\/N/i.test(l.map(c=>c.s).join(' '))))return pdfEPartnerRows(pages);
  const t=pdfTableRows(pages);
  if(t.length)return t;
  return pdfStatementRows(pages);
}

async function loadFiles(files,skipped=0){

  const reading=files.map(f=>{const r=readFileNow(f);r.catch(()=>{});return r});   // start reading straight away (iPhone)
  const allPdf=files.every(isPdf),merge=allPdf&&policies.length&&!sampleLoaded;
  if(!merge&&dirty&&!confirm('You have unsaved review changes. Load a new file anyway?'))return;
  let list=[];const failed=[],blocked=[];
  for(let i=0;i<files.length;i++){

    if(files.length>1)toast(`Reading ${isPdf(f)?'PDF':'file'} ${i+1} of ${files.length}…`);else if(allPdf)toast('Reading PDF…');
    try{
      let buf;

    }catch(err){failed.push(f.name+' ('+err.message+')')}

  if(blocked.length)alert('Your phone did not let the app open:\n'+blocked.join('\n')+'\n\nOn iPhone: in WhatsApp, email or OneDrive, tap Share → Save to Files → On My iPhone. Then tap Load Excel / PDF, choose Browse → On My iPhone, and pick the files there.');
  if(failed.length)alert((list.length?'Some files could not be read:\n':'')+failed.join('\n')+'\n\n'+(allPdf?'No policy details found. The app reads ePartner "Policy Detail Information" printouts, PDF tables with headings like Policy No, Plan, Sum Assured, Premium, Nominee, and lines like "Policy No: …". Please send a sample of this PDF layout so it can be added, or use the Excel export.':'No policy rows found. Check the column headers match the template.'));
  if(!list.length)return;
  if(merge){
    let added=0,updated=0;
    list.forEach(p=>{
      // keep what the PDF doesn't contain: client profile entered during review, and the policy's purpose
      const known=policies.find(q=>q.clientId===p.clientId);

      const j=policies.findIndex(q=>q.policyNo&&q.policyNo===p.policyNo);
      if(j>=0){if(!p.purpose)p.purpose=policies[j].purpose;policies[j]=p;updated++}else{policies.push(p);added++}});

    const msg=[added&&`added ${added} polic${added===1?'y':'ies'}`,updated&&`updated ${updated} polic${updated===1?'y':'ies'}`].filter(Boolean).join(', ')+` from ${files.length===1?'PDF':files.length+' PDFs'}`;
    toast(msg[0].toUpperCase()+msg.slice(1)+skipNote);
  }else{
    setData(list);sampleLoaded=false;
    const nc=new Set(list.map(p=>p.clientId)).size;
    if(allPdf&&nc===1)go('client',list[0].clientId);
    toast(`Loaded ${list.length} polic${list.length===1?'y':'ies'} for ${nc} client${nc===1?'':'s'} from ${files.length===1?files[0].name:files.length+' files'}${skipNote}`);
  }
}

/* ================= analysis ================= */
function clients(){
  const map=new Map();
  policies.forEach((p,i)=>{
    const id=p.clientId||'(no id)';
    if(!map.has(id))map.set(id,{id,name:'',age:0,income:0,dependants:0,lastReview:'',policies:[]});
    const c=map.get(id);
    c.policies.push(Object.assign(p,{_i:i}));
    if(!c.name&&p.clientName)c.name=p.clientName;
    if(!c.age&&p.age)c.age=p.age;
    if(!c.income&&p.income)c.income=p.income;
    if(!c.dependants&&p.dependants)c.dependants=p.dependants;
    if(p.lastReview&&p.lastReview>c.lastReview)c.lastReview=p.lastReview;
  });
  return [...map.values()].map(c=>Object.assign(c,analyse(c)));
}
function analyse(c){
  const act=c.policies.filter(isActive);
  const inc=c.income||0;
  // life and CI: income multiple, but never below the minimum benchmark
  const target={life:Math.max(inc*S.lifeMult,+S.lifeMin||0),tpd:Math.max(inc*S.tpdMult,+S.tpdMin||0),ci:Math.max(inc*S.ciMult,+S.ciMin||0),medical:+S.medMin,pa:+S.paMin};
  const areas=AREAS.map(k=>{
    const have=act.reduce((s,p)=>s+(p[k]||0),0),t=target[k];
    const pct=t>0?have/t:(have>0?1:null);
    const status=pct===null?'na':pct>=1?'good':pct>=.5?'partial':'gap';
    return{key:k,have,target:t,pct,status,shortfall:Math.max(0,t-have)};
  });
  const annual=act.reduce((s,p)=>s+annualPrem(p),0);
  const actions=[];
  areas.forEach(a=>{if(a.status==='gap'||a.status==='partial')actions.push({k:'act_'+a.key,v:a.shortfall,sev:a.status})});
  act.forEach(p=>{if(!p.nominee)actions.push({k:'act_nominee',v:p.policyNo,sev:'gap'})});
  act.forEach(p=>{if(p.waiver==='No')actions.push({k:'act_waiver',v:p.policyNo,sev:'partial'})});
  c.policies.filter(p=>p.status==='Lapsed').forEach(p=>actions.push({k:'act_lapsed',v:p.policyNo,sev:'partial'}));
  c.policies.filter(p=>p.status==='Terminated').forEach(p=>actions.push({k:'act_terminated',v:p.policyNo,sev:'gap'}));
  if(inc&&annual/inc>.15)actions.push({k:'act_afford',sev:'partial'});
  const scored=areas.filter(a=>a.pct!==null);
  const score=scored.length?Math.round(scored.reduce((s,a)=>s+Math.min(a.pct,1),0)/scored.length*100):0;
  const nextReview=c.lastReview?addYear(c.lastReview):'';
  const cashList=c.policies.filter(p=>hasCash(p)&&p.cashValue),cash=cashList.reduce((s,p)=>s+p.cashValue,0);
  return{areas,annual,actions,score,nextReview,activeCount:act.length,cash,cashList};
}

function mergeClient(fromId,toId,confirmed){
  const all=clients(),from=all.find(x=>x.id===fromId),to=all.find(x=>x.id===toId);if(!from||!to||fromId===toId)return;
  if(!confirmed&&!confirm(`Merge ${from.name||from.id} (ID ${from.id}, ${from.policies.length} polic${from.policies.length===1?'y':'ies'}) into ${to.name||to.id} (ID ${to.id})?`))return;
  const prof={};['income','dependants','age','lastReview'].forEach(f=>prof[f]=to[f]||from[f]||(f==='lastReview'?'':0));
  from.policies.forEach(p=>{p.clientId=toId;p.clientName=to.name||from.name});
  policies.filter(p=>p.clientId===toId).forEach(p=>Object.assign(p,prof));
  if(notes[fromId]){notes[toId]=[notes[toId],notes[fromId]].filter(Boolean).join('\n');delete notes[fromId]}
  changes.forEach(x=>{if(x.clientId===fromId)x.clientId=toId});
  changes.push({clientId:toId,policyNo:from.policies.map(p=>p.policyNo).join(', '),field:'clientId',from:fromId,to:toId,at:new Date().toLocaleString('en-GB')});
  [...changedCells].filter(k=>k.startsWith(fromId+'|')).forEach(k=>{changedCells.delete(k);changedCells.add(toId+k.slice(fromId.length))});
  dirty=true;view.mergeOpen=false;view.clientId=toId;renderClient();
  toast(`Merged ${from.policies.length} polic${from.policies.length===1?'y':'ies'} into ${to.name||to.id}`);
}

  const byType={};c.policies.filter(isActive).forEach(p=>{const t=p.type||'Other';byType[t]=(byType[t]||0)+annualPrem(p)});
  const entries=Object.entries(byType).sort((a,b)=>b[1]-a[1]);
  let acc=0;const grad=entries.map(([,v],i)=>{const a=acc/c.annual*360;acc+=v;return `${PALETTE[i%PALETTE.length]} ${a}deg ${acc/c.annual*360}deg`}).join(',');
  $('#cv-analysis').innerHTML=`<div class="grid g2">
    <div class="card"><h2>Coverage vs recommended <span class="sub">overall protection score <b style="color:var(--brand)">${c.score}%</b></span></h2>
      ${c.areas.map(a=>`<div class="cov"><div class="top"><span class="name">${AREA_EN[a.key]} <button class="pen" title="Edit ${AREA_EN[a.key]} amount" onclick="view.editArea=view.editArea==='${a.key}'?null:'${a.key}';renderAnalysis()">${view.editArea===a.key?'✕ Close':'✏ Edit'}</button></span><span class="pill p-${a.status}">${a.pct===null?'N/A':Math.round(a.pct*100)+'%'}</span></div>
        <div class="track"><div class="fill ${a.status}" style="width:${a.pct===null?0:Math.min(a.pct,1)*100}%"></div></div>
        <div class="meta">Has ${money(a.have)} · Target ${a.target?money(a.target):'not required'}${a.shortfall?` · <b style="color:var(--gap)">Short ${money(a.shortfall)}</b>`:''}</div>
        ${a.key==='medical'?medSubHtml(c,T.en):''}
        ${view.editArea===a.key?`<div class="cov-edit">${c.policies.map(p=>{
          const inp=(f,ph,lbl)=>`<span class="amt">${lbl?`<small>${lbl}</small>`:''}${esc(S.currency)} <input class="${changedCells.has(p._i+'|'+f)?'changed':''}" data-i="${p._i}" data-f="${f}" ${f==='medLifetime'?'list="lim-opts"':'inputmode="decimal"'} value="${esc(p[f]||'')}" placeholder="${ph}"></span>`;
          return `<label><span><b>${esc(p.plan||p.policyNo)}</b> <span class="muted">${esc(p.policyNo)}${p.status!=='Active'?' · '+esc(p.status):''}</span></span>
          ${a.key==='medical'?`<span class="amt3">${inp('medical','0','Annual')}${inp('medLifetime','0 or Unlimited','Lifetime')}${inp('roomBoard','0','R&B / day')}${inp('hospIncome','0','Hospital income / day')}</span>`:inp(a.key,'0')}</label>`}).join('')}
          <div class="muted" style="font-size:12px">Only Active policies count toward coverage. Changes are logged and shown on the client report.</div></div>`:''}</div>`).join('')}
    </div>
    <div>
      <div class="card"><h2>Total cash value <button class="pen" title="Edit cash values" onclick="view.editArea=view.editArea==='cash'?null:'cash';renderAnalysis()">${view.editArea==='cash'?'✕ Close':'✏ Edit'}</button></h2>
        <div class="cash-big">${money(c.cash)}</div>
        ${cashListHtml(c,T.en)}
        ${view.editArea==='cash'?`<div class="cov-edit">${c.policies.map(p=>`<label><span><b>${esc(p.plan||p.policyNo)}</b> <span class="muted">${esc(p.policyNo)}${p.status!=='Active'?' · '+esc(p.status):''}</span></span>
          <span class="amt3"><span class="amt"><small>Cash value</small>${esc(S.currency)} <input class="${changedCells.has(p._i+'|cashValue')?'changed':''}" data-i="${p._i}" data-f="cashValue" inputmode="decimal" value="${p.cashValue||''}" placeholder="0"></span>
          <span class="amt"><small>As at</small><input type="date" class="${changedCells.has(p._i+'|cashAsAt')?'changed':''}" data-i="${p._i}" data-f="cashAsAt" value="${esc(p.cashAsAt||'')}"></span></span></label>`).join('')}
          <div class="muted" style="font-size:12px">Use the net surrender value (or fund value for investment-linked plans). Surrendered, matured, terminated and proposed policies are not counted.</div></div>`:''}
      </div>
      <div class="card"><h2>Premium breakdown</h2>
        <div class="donutwrap">
          <div class="donut" style="background:${c.annual?`conic-gradient(${grad})`:'#edf0f5'}"><span><b>${money(c.annual)}</b>per year</span></div>
          <div>${entries.map(([t,v],i)=>`<div class="lg-row"><span class="lg-sw" style="background:${PALETTE[i%PALETTE.length]}"></span>${esc(t)} · ${money(v)}</div>`).join('')||'<span class="muted">No active policies</span>'}
          ${c.income?`<div class="muted" style="font-size:12px;margin-top:6px">${(c.annual/c.income*100).toFixed(1)}% of annual income</div>`:''}</div>

      <div class="card"><h2>Areas to enhance</h2>

    </div></div>`;
}
function renderLog(){
  const c=getClient();if(!c)return;
  const list=changes.filter(x=>x.clientId===c.id);
  $('#cv-log').innerHTML=list.length?`<table class="log"><thead><tr><th>Policy</th><th>Field</th><th>Before</th><th>After</th></tr></thead><tbody>${list.map(x=>`<tr><td>${esc(x.policyNo)}</td><td>${esc(FIELD_LABEL[x.field]||x.field)}</td><td class="muted">${esc(fmtVal(x.field,x.from))}</td><td><b>${esc(fmtVal(x.field,x.to))}</b></td></tr>`).join('')}</tbody></table>`:'<div class="muted">No changes yet.</div>';
}
function fmtVal(f,v){if(f==='cashAsAt'||f==='lastReview')return fmtDate(v);if(v===UNLIMITED)return UNLIMITED;if(NUM.has(f)&&f!=='age'&&f!=='dependants')return v===''||v===null?'—':money(v);return v===''||v==null?'—':v}

// live editing
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.cf){   // client profile (income, dependants): applies to all of the client's policies
    const c=getClient(),f=t.dataset.cf,nv=toNum(t.value);if(nv===(c[f]||0))return;
    changes.push({clientId:c.id,policyNo:'(all)',field:f,from:c[f]||0,to:nv,at:new Date().toLocaleString('en-GB')});
    c.policies.forEach(p=>p[f]=nv);changedCells.add(c.id+'|'+f);dirty=true;renderClient();return;
  }
  if(t.dataset.i===undefined)return;
  const p=policies[+t.dataset.i],f=t.dataset.f;
  const nv=NUM.has(f)?numIn(f,t.value):t.value.trim();
  if(nv===p[f])return;
  changes.push({clientId:p.clientId,policyNo:p.policyNo,field:f,from:p[f],to:nv,at:new Date().toLocaleString('en-GB')});
  p[f]=nv;changedCells.add(p._i+'|'+f);t.classList.add('changed');dirty=true;
  if(NUM.has(f))t.value=nv||'';
  if(t.closest('.cov-edit'))return renderClient();   // keep the policy table in step
  renderAnalysis();renderLog();
});
document.addEventListener('input',e=>{if(e.target.id==='notes'){notes[view.clientId]=e.target.value;dirty=true}});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});

function addPolicy(){
  const c=getClient(),base=c.policies[0];
  const p={};COLS.forEach(k=>p[k[0]]=NUM.has(k[0])?0:'');
  Object.assign(p,{clientId:c.id,clientName:c.name,age:c.age,income:c.income,dependants:c.dependants,lastReview:c.lastReview,
    policyNo:'NEW-'+(changes.length+policies.length+1),plan:'',type:'',status:'Proposed',frequency:'Monthly',start:today()});
  policies.push(p);
  changes.push({clientId:c.id,policyNo:p.policyNo,field:'status',from:'',to:'Proposed',at:new Date().toLocaleString('en-GB')});
  dirty=true;renderClient();toast('Proposed policy added. Fill in plan, premium and cover.');
}
function markReviewed(){
  const c=getClient(),t=today();
  c.policies.forEach(p=>{if(p.lastReview!==t){p.lastReview=t}});
  changes.push({clientId:c.id,policyNo:'(all)',field:'lastReview',from:c.lastReview,to:t,at:new Date().toLocaleString('en-GB')});
  dirty=true;renderClient();toast('Review date set to today. Next review in 12 months.');
}

/* ---------- client report as a PDF file (made on the device, works offline) ---------- */
function canSharePdf(){try{return matchMedia('(pointer:coarse)').matches&&!!navigator.canShare&&navigator.canShare({files:[new File([''],'x.pdf',{type:'application/pdf'})]})}catch(e){return false}}
async function loadPdfMaker(){
  const need=[['html2canvas','html2canvas.min.js','html2canvas/1.4.1/html2canvas.min.js'],['jspdf','jspdf.umd.min.js','jspdf/2.5.1/jspdf.umd.min.js']];
  for(const [g,local,cdn] of need)if(!window[g]){try{await loadScript(local)}catch(e){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/'+cdn)}}
}
let makingPdf=false;
async function downloadReport(share){
  if(makingPdf)return;makingPdf=true;
  const c=getClient();toast('Preparing PDF…');
  const W=704,pageH=Math.floor(W*273/186);   // A4 content area 186 × 273 mm (12 mm margins), in CSS px
  const stage=document.createElement('div');stage.className='pdf-stage';
  try{
    await loadPdfMaker();
    const rep=$('.report').cloneNode(true);stage.appendChild(rep);document.body.appendChild(stage);
    // page breaks only between sections, cards, table rows and list items
    const top0=rep.getBoundingClientRect().top;
    const cuts=[...new Set([...rep.querySelectorAll('.r-sec,.r-sec h2,.r-area,.r-table tr,.r-enh li,.r-prem,.r-sign,.r-disc')].map(e=>Math.round(e.getBoundingClientRect().top-top0)))].sort((a,b)=>a-b);
    const total=Math.ceil(rep.getBoundingClientRect().height);
    const scale=2,canvas=await html2canvas(rep,{scale,backgroundColor:'#ffffff',logging:false});
    const pdf=new jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
    const slices=[];let start=0;
    while(start<total-2){
      let end=Math.min(start+pageH,total);
      if(end<total){const c2=cuts.filter(y=>y>start+pageH*.3&&y<=start+pageH).pop();if(c2)end=c2}
      slices.push([start,end]);start=end;
    }
    slices.forEach(([a,b],i)=>{
      const part=document.createElement('canvas');part.width=canvas.width;part.height=Math.ceil((b-a)*scale);
      part.getContext('2d').drawImage(canvas,0,a*scale,canvas.width,part.height,0,0,canvas.width,part.height);
      if(i)pdf.addPage();
      pdf.addImage(part.toDataURL('image/jpeg',.92),'JPEG',12,12,186,(b-a)*186/W);
      pdf.setFontSize(8);pdf.setTextColor(140);pdf.text(`${i+1} / ${slices.length}`,198,290,{align:'right'});
    });
    const name=`Policy-Review-${(c.name||c.id).replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-')}-${today()}-${view.lang.toUpperCase()}.pdf`;
    const blob=pdf.output('blob');
    if(share){
      const file=new File([blob],name,{type:'application/pdf'});
      try{await navigator.share({files:[file],title:name})}catch(e){if(e.name!=='AbortError')pdf.save(name)}
    }else{pdf.save(name);toast('PDF downloaded: '+name)}
    window.__lastPdf={name,pages:slices.length,size:blob.size};
  }catch(err){alert('Could not make the PDF: '+err.message+'\n\nYou can still use 🖨 Print and choose "Save as PDF".')}
  finally{stage.remove();makingPdf=false}
}

function sheetRows(list){return list.map(p=>Object.fromEntries(COLS.map(([f,h])=>[h,['lastReview','start','maturity','cashAsAt'].includes(f)?fmtDate(p[f]).replace('—',''):p[f]])))}
function needXLSX(){if(!window.XLSX){alert('Excel library could not load. Make sure xlsx.full.min.js is in the same folder as this app.');return false}return true}
function exportUpdated(){
  if(!policies.length)return toast('Load data first');
  if(!needXLSX())return;
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(sheetRows(policies)),'Policies');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(changes.length?changes.map(x=>({'Client ID':x.clientId,'Policy No':x.policyNo,Field:FIELD_LABEL[x.field]||x.field,Before:x.field==='lastReview'?fmtDate(x.from):x.from,After:x.field==='lastReview'?fmtDate(x.to):x.to,'Changed at':x.at})):[{Note:'No changes'}]),'Change Log');

}
